<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa do Lixo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .barra {
    position: absolute; z-index: 1000; left: 12px; right: 12px; bottom: 16px;
    display: flex; gap: 8px;
  }
  .barra button, .barra label {
    flex: 1; padding: 14px; border: 0; border-radius: 12px; font-size: 16px;
    font-weight: 600; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    cursor: pointer;
  }
  #btnFoto { background: #1b8a3a; color: #fff; }
  #btnAlternar { background: #fff; color: #222; flex: 0 0 auto; }
  #status {
    position: absolute; z-index: 1000; top: 12px; left: 64px; right: 12px;
    background: rgba(255,255,255,.95); padding: 10px 12px; border-radius: 10px;
    font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  input[type=file] { display: none; }
  .popup img { width: 180px; border-radius: 8px; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="status">Carregando mapa...</div>
<div id="map"></div>
<div class="barra">
  <label id="btnFoto">
    📷 Reportar lixo aqui
    <input id="arquivo" type="file" accept="image/*" capture="environment">
  </label>
  <button id="btnAlternar">🔥 / 📍</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script>
// Centro de reserva caso o GPS não seja liberado (troque pela sua cidade)
const CENTRO_RESERVA = [-8.0476, -34.8770];
const CHAVE = "mapa-lixo-pontos-v1";

const mapa = L.map("map").setView(CENTRO_RESERVA, 14);
// Para testes: mapa Esri (sem chave). Depois trocamos por MapTiler ou OpenStreetMap hospedado.
const mapaEsri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19,
  attribution: "Tiles &copy; Esri"
}).addTo(mapa);

// Só funciona quando o arquivo está hospedado (site ou localhost), não aberto da pasta
const mapaOSM = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap"
});

L.control.layers({ "Esri (teste)": mapaEsri, "OpenStreetMap (hospedado)": mapaOSM }, null, { position: "topright" }).addTo(mapa);

const calor = L.heatLayer([], { radius: 28, blur: 22, maxZoom: 17 }).addTo(mapa);
const marcadores = L.layerGroup();
let mostrandoCalor = true;
let ultimaData = null;

function mostrarMarcadores() {
  mostrandoCalor = false;
  mapa.removeLayer(calor);
  mapa.addLayer(marcadores);
}

let pontos = [];
try { pontos = JSON.parse(localStorage.getItem(CHAVE) || "[]"); } catch (e) {}

function salvar() {
  try { localStorage.setItem(CHAVE, JSON.stringify(pontos)); }
  catch (e) { /* fotos grandes podem estourar o limite no teste */ }
}

function desenhar() {
  calor.setLatLngs(pontos.map(p => [p.lat, p.lng, 1]));
  marcadores.clearLayers();
  pontos.forEach(p => {
    const html = '<div class="popup">' +
      (p.foto ? '<img src="' + p.foto + '">' : '<b>Ponto de teste (sem foto)</b><br>') +
      '<small>' + new Date(p.data).toLocaleString("pt-BR") + '</small></div>';
    const m = L.marker([p.lat, p.lng]).bindPopup(html).addTo(marcadores);
    if (p.data === ultimaData) m.openPopup();
  });
  status(pontos.length + " ponto(s) no mapa");
}

function status(t) { document.getElementById("status").textContent = t; }

// Reduz a foto para ~800px para não pesar
function reduzir(arquivo) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const max = 800, esc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * esc; c.height = img.height * esc;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL("image/jpeg", 0.6));
    };
    img.src = URL.createObjectURL(arquivo);
  });
}

document.getElementById("arquivo").addEventListener("change", async e => {
  const arq = e.target.files[0];
  if (!arq) return;
  status("Pegando sua localização...");
  navigator.geolocation.getCurrentPosition(async pos => {
    const foto = await reduzir(arq);
    const agora = Date.now();
    pontos.push({
      lat: pos.coords.latitude, lng: pos.coords.longitude,
      data: agora, foto
    });
    ultimaData = agora;
    salvar();
    mostrarMarcadores();
    mapa.setView([pos.coords.latitude, pos.coords.longitude], 17);
    desenhar();
  }, () => status("Não consegui o GPS. Libere a localização no navegador."),
  { enableHighAccuracy: true, timeout: 15000 });
  e.target.value = "";
});

document.getElementById("btnAlternar").addEventListener("click", () => {
  mostrandoCalor = !mostrandoCalor;
  if (mostrandoCalor) { mapa.addLayer(calor); mapa.removeLayer(marcadores); }
  else { mapa.removeLayer(calor); mapa.addLayer(marcadores); }
});

// Centraliza onde você estiver; se negar, usa o centro de reserva
navigator.geolocation.getCurrentPosition(pos => {
  const c = [pos.coords.latitude, pos.coords.longitude];
  mapa.setView(c, 15);
  // Pontos de teste só se o mapa estiver vazio, espalhados perto de você
  if (pontos.length === 0) {
    for (let i = 0; i < 25; i++) {
      pontos.push({
        lat: c[0] + (Math.random() - 0.5) * 0.01,
        lng: c[1] + (Math.random() - 0.5) * 0.01,
        data: Date.now(), foto: null, teste: true
      });
    }
    desenhar();
  }
}, () => {
  if (pontos.length === 0) {
    for (let i = 0; i < 25; i++) {
      pontos.push({
        lat: CENTRO_RESERVA[0] + (Math.random() - 0.5) * 0.01,
        lng: CENTRO_RESERVA[1] + (Math.random() - 0.5) * 0.01,
        data: Date.now(), foto: null, teste: true
      });
    }
  }
  desenhar();
});

desenhar();
</script>
</body>
</html>
