<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa do Lixo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .barra {
    position: absolute; z-index: 1000; left: 12px; right: 12px; bottom: 16px;
    display: flex; gap: 8px;
  }
  .barra button, .barra label {
    flex: 1; padding: 14px; border: 0; border-radius: 12px; font-size: 16px;
    font-weight: 600; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.3);
    cursor: pointer;
  }
  #btnFoto { background: #1b8a3a; color: #fff; }
  #btnAlternar { background: #fff; color: #222; flex: 0 0 auto; }
  #status {
    position: absolute; z-index: 1000; top: 12px; left: 64px; right: 12px;
    background: rgba(255,255,255,.95); padding: 10px 12px; border-radius: 10px;
    font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  input[type=file] { display: none; }
  .popup img { width: 180px; border-radius: 8px; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="status">Carregando mapa...</div>
<div id="map"></div>
<div class="barra">
  <label id="btnFoto">
    📷 Reportar lixo aqui
    <input id="arquivo" type="file" accept="image/*" capture="environment">
  </label>
  <button id="btnAlternar">🔥 / 📍</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== Configuração =====
const SUPABASE_URL = "https://ppgvsrltpajkzadwpnya.supabase.co";
const SUPABASE_KEY = "sb_publishable_751Q43FE8rKJs9mtSFSiVQ_pNa1G6NZ";
// Centro de reserva caso o GPS não seja liberado
const CENTRO_RESERVA = [-8.0476, -34.8770];

const chaveOk = SUPABASE_KEY && SUPABASE_KEY.indexOf("COLE") !== 0;
const sb = chaveOk ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

function status(t) { document.getElementById("status").textContent = t; }

// ===== Mapa =====
const mapa = L.map("map").setView(CENTRO_RESERVA, 14);

const mapaEsri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19,
  attribution: "Tiles &copy; Esri"
}).addTo(mapa);

const mapaOSM = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap"
});

L.control.layers({ "Esri": mapaEsri, "OpenStreetMap": mapaOSM }, null, { position: "topright" }).addTo(mapa);

const calor = L.heatLayer([], { radius: 28, blur: 22, maxZoom: 17 }).addTo(mapa);
const marcadores = L.layerGroup();
let mostrandoCalor = true;
let ultimoId = null;
let pontos = [];

function mostrarMarcadores() {
  mostrandoCalor = false;
  mapa.removeLayer(calor);
  mapa.addLayer(marcadores);
}

function criarPopup(p) {
  const div = document.createElement("div");
  div.className = "popup";
  if (p.foto_url) {
    const img = document.createElement("img");
    img.src = p.foto_url;
    img.alt = "Foto do lixo";
    div.appendChild(img);
  }
  const pequeno = document.createElement("small");
  pequeno.textContent = new Date(p.created_at).toLocaleString("pt-BR");
  div.appendChild(pequeno);
  return div;
}

function desenhar() {
  calor.setLatLngs(pontos.map(p => [p.lat, p.lng, 1]));
  marcadores.clearLayers();
  pontos.forEach(p => {
    const m = L.marker([p.lat, p.lng]).bindPopup(criarPopup(p)).addTo(marcadores);
    if (p.id === ultimoId && mapa.hasLayer(marcadores)) m.openPopup();
  });
  status(pontos.length + " ponto(s) no mapa");
}

// ===== Banco de dados =====
async function buscar() {
  const resp = await sb.from("denuncias")
    .select("id, created_at, lat, lng, foto_url")
    .order("created_at", { ascending: false })
    .limit(1000);
  if (resp.error) throw new Error("carregar pontos: " + resp.error.message);
  pontos = resp.data || [];
}

async function carregar() {
  if (!sb) { status("Falta colocar a chave do Supabase no arquivo."); return; }
  try {
    await buscar();
    desenhar();
  } catch (err) {
    status("Erro: " + err.message);
  }
}

// ===== Foto =====
function carregarImagem(arquivo) {
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    const limite = setTimeout(() => reject(new Error("tempo esgotado ao ler a foto")), 20000);
    leitor.onerror = () => { clearTimeout(limite); reject(new Error("falha ao ler o arquivo")); };
    leitor.onload = () => {
      const img = new Image();
      img.onload = () => { clearTimeout(limite); resolve(img); };
      img.onerror = () => { clearTimeout(limite); reject(new Error("formato de foto não suportado")); };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}

// Reduz a foto para ~800px e devolve um arquivo JPEG leve
async function reduzir(arquivo) {
  const max = 800;
  let fonte;
  try {
    fonte = await createImageBitmap(arquivo, { imageOrientation: "from-image" });
  } catch (e) {
    fonte = await carregarImagem(arquivo);
  }
  const esc = Math.min(1, max / Math.max(fonte.width, fonte.height));
  const c = document.createElement("canvas");
  c.width = Math.round(fonte.width * esc);
  c.height = Math.round(fonte.height * esc);
  c.getContext("2d").drawImage(fonte, 0, 0, c.width, c.height);
  return new Promise((resolve, reject) => {
    c.toBlob(b => b ? resolve(b) : reject(new Error("não consegui comprimir a foto")), "image/jpeg", 0.7);
  });
}

function pegarPosicao() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      resolve,
      err => reject(new Error("GPS: " + err.message + ". Libere a localização para este site.")),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
    );
  });
}

// ===== Envio de uma denúncia =====
document.getElementById("arquivo").addEventListener("change", async e => {
  const arq = e.target.files[0];
  if (!arq) return;
  if (!sb) { status("Falta colocar a chave do Supabase no arquivo."); return; }
  try {
    status("1/4 Lendo a foto...");
    const blob = await reduzir(arq);
    e.target.value = "";

    status("2/4 Pegando sua localização...");
    const pos = await pegarPosicao();

    status("3/4 Enviando a foto...");
    const nome = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
    const envio = await sb.storage.from("fotos").upload(nome, blob, { contentType: "image/jpeg" });
    if (envio.error) throw new Error("envio da foto: " + envio.error.message);
    const url = sb.storage.from("fotos").getPublicUrl(nome).data.publicUrl;

    status("4/4 Salvando a denúncia...");
    const ins = await sb.from("denuncias")
      .insert({ lat: pos.coords.latitude, lng: pos.coords.longitude, foto_url: url })
      .select("id")
      .single();
    if (ins.error) throw new Error("salvar denúncia: " + ins.error.message);
    ultimoId = ins.data.id;

    await buscar();
    mostrarMarcadores();
    mapa.setView([pos.coords.latitude, pos.coords.longitude], 17);
    desenhar();
    status("Pronto! Denúncia enviada. " + pontos.length + " ponto(s) no mapa");
  } catch (err) {
    e.target.value = "";
    status("Erro: " + err.message);
  }
});

// ===== Botão calor / marcadores =====
document.getElementById("btnAlternar").addEventListener("click", () => {
  mostrandoCalor = !mostrandoCalor;
  if (mostrandoCalor) { mapa.addLayer(calor); mapa.removeLayer(marcadores); }
  else { mapa.removeLayer(calor); mapa.addLayer(marcadores); }
});

// ===== Início =====
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => mapa.setView([pos.coords.latitude, pos.coords.longitude], 15),
    () => {},
    { timeout: 10000, maximumAge: 60000 }
  );
}
carregar();
</script>
</body>
</html>
